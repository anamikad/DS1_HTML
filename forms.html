<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <fieldset>
      <form action="./response.html" method="post">
        <label for="name">UserName:</label>
        <input
          type="text"
          name="name"
          id="name"
          placeholder="Enter your Name"
          required
        />
        <br />
        <br />
        <label for="password">Password:</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter your Password"
          required
        /><br /><br />
        <label for="email">Email:</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your Email"
          required
        />
        <br /><br />
        <label for="Gender">Gender:</label>
        <!--  <select name="Gender" id="Gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>-->
        <input type="radio" name="Gender" id="male" value="male" />
        <label for="male">Male</label>
        <input type="radio" name="Gender" id="female" value="female" />
        <label for="female">Female</label>

        <br /><br />
        <label for="Hobbies">Hobbies:</label>
        <input type="checkbox" name="Hobbies" id="reading" value="reading" />

        <label for="reading">Reading</label>
        <input type="checkbox" name="Hobbies" id="sports" value="sports" />

        <label for="sports">Sports</label>
        <input type="checkbox" name="Hobbies" id="music" value="music" />
        <label for="music">Music</label>
        <br /><br />

        <label for="Age">Age:</label>
        <input type="number" name="Age" id="Age" placeholder="Enter your Age" />
        <br /><br />
        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob" />
        <br /><br />

        <label for="language">Programming Language:</label>
        <select name="lang" id="lang">
          <option value="Select lang">Select Language</option>
          <option value="C">C</option>
          <option value="C++">C++</option>
          <option value="python">Python</option>
          <option value="java">Java</option>
        </select>
        <br /><br />
        <fieldset>
          <input type="number " name=" attepmt" id="attepmt" />

          <label for="attepmt">Attempt</label>
          <br /><br />

          <input type="submit" value="Submit form " />
          <input type="reset" />
        </fieldset>
      </form>
    </fieldset>
  </body>
</html>
